<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">{% include 'pwa.html' %}
<header class="top"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="ASM"><nav><a href="{{ url_for('index') }}">Home</a></nav></header>
<main>{% if m %}<div class="banner" style="--i:1">{{ m }}</div>{% endif %}
<section class="card" style="--i:2"><h2><span>My password</span></h2><form method="post" action="{{ url_for('account') }}" class="mv"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current<input type="password" name="current" required autocomplete="current-password"></label><label>New (8+ characters)<input type="password" name="new" required autocomplete="new-password"></label><button class="btn">Change password</button></form></section>
{% if admin %}<section class="card" style="--i:3;border-left-color:var(--red)"><h2><span>Staff accounts</span><span class="ar" dir="rtl">الموظفون</span></h2>
{% for u in users %}<div class="nt {{ '' if u.active else 'done' }}"><div><b>{{ u.username }}</b><small>{{ u.role }}{{ '' if u.active else ' · disabled' }}</small></div>
<form method="post" action="{{ url_for('staff_password', uid=u.id) }}" class="inl"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" placeholder="New password" style="width:130px"><button class="btn ghost">Set</button></form>
{% if u.id != session.get('uid') %}<form method="post" action="{{ url_for('staff_toggle', uid=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn {{ 'danger' if u.active else '' }}">{{ 'Disable' if u.active else 'Enable' }}</button></form>{% endif %}</div>{% endfor %}
<form method="post" action="{{ url_for('staff_add') }}" class="mv" style="margin-top:14px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocapitalize="none"></label><label>Password (8+)<input type="password" name="password" required></label>
<label>Role<select name="role"><option value="staff">Staff (no delete, backup or export)</option><option value="admin">Administrator</option></select></label><button class="btn red">Add staff member</button></form></section>{% endif %}</main></html>
